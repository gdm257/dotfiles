# KeySteer user overrides. Full defaults: keysteer --dump-config
# A bindings table replaces that mode's defaults; keep the keys you need.

[hotkeys]
"primary+w" = "window"
"primary+q" = "normal"

[normal.bindings]
"?" = "key_help"
'\' = "text_input"
"e i arrow_up" = "move_up"
"d k arrow_down" = "move_down"
"s j arrow_left" = "move_left"
"f l arrow_right" = "move_right"
caps_lock = "precision"
left_shift = "slow"
"z ," = "wheel_up"
"x ." = "wheel_down"
"w u" = "scroll_left"
"r o" = "scroll_right"
"space c m" = "left_click"
"a ;" = "right_click"
"b /" = "middle_click"
"v n" = "toggle"
g = "grid"
"primary+g" = "recursive_grid"
"t y" = "ui_hint"
"primary+c" = "text_select"
"primary+f" = "bisect"
"primary+s" = "screen next"
"primary+d" = "move_window next"
"primary+w" = "window"
"q p esc" = "idle"

[pointer]
initial_speed = 1300.0

[ui_hint]
hint_characters = "sdfwegrta"
scan_scope = "active"

[recursive_grid]
keys = "wersdfxcv"

[bisect.bindings]
"e i arrow_up" = "bisect_up"
"d k arrow_down" = "bisect_down"
"s j arrow_left" = "bisect_left"
"f l arrow_right" = "bisect_right"
enter = "confirm_selection"
esc = "cancel_selection"
"tab backspace" = "previous_level"
space = "first_level"
"`" = "follow"
"primary+q" = "normal"

[text_select]
hint_characters = "trsdwegf"

[window.bindings]
"?" = "key_help"
q = "idle"
"primary+q" = "idle"
g = "grid"
"primary+g" = "recursive_grid"
"primary+f" = "bisect"
tab = "window_select"
"shift+tab" = "window_select_previous"
"ctrl" = "window_multi_select"
"ctrl+x" = "window_multi_clear"
"e i arrow_up" = "window_up"
"d k arrow_down" = "window_down"
"s j arrow_left" = "window_left"
"f l arrow_right" = "window_right"
a = "window_center"
r = "window_undo"
"shift+r" = "window_redo"
"shift+c" = "window_reset_initial"
v = "window_size"
z = "window_minimize"
x = "window_maximize"
c = "window_close"
"v+d v+k v+arrow_down" = "window_volume_down"
"v+e v+i v+arrow_up" = "window_volume_up"
"v+m" = "window_volume_mute"
"shift+v+m" = "window_system_volume_mute"
"v+s v+j v+arrow_left" = "window_audio_previous"
"v+f v+l v+arrow_right" = "window_audio_next"
"shift+v+d shift+v+k shift+v+arrow_down" = "window_system_volume_down"
"shift+v+e shift+v+i shift+v+arrow_up" = "window_system_volume_up"
"shift+v+s shift+v+j shift+v+arrow_left" = "window_system_audio_previous"
"shift+v+f shift+v+l shift+v+arrow_right" = "window_system_audio_next"
