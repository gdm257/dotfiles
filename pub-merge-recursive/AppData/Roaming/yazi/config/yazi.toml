# https://yazi-rs.github.io/docs/configuration/yazi
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
linemode = "size"
ratio = [1, 3, 3]

[preview]
# image_filter = "lanczos3"

[open]
prepend_rules = [
	{ url = "*.md", use = ["md", "edit"] },
]

[opener]
md = [
  # ==== Windows ====
  { run = 'inknote %s1', orphan = true, desc = "inknote", for = "windows" },
  # { run = 'md-preview %s1', orphan = true, desc = "md-preview", for = "windows" },
  # { run = 'marktext %s1', orphan = true, desc = "marktext", for = "windows" },
]

edit = [
  # ==== Unix ====
  { run = '${EDITOR:-nvim} %s1', block = true, desc = "$EDITOR", for = "unix" },
  { run = 'vim %s1', block = true, desc = "vim", for = "unix" },
  { run = 'nvim %s1', block = true, desc = "nvim", for = "unix" },
  # { run = 'vi %s1', block = true, desc = "vi", for = "unix" },
  # { run = 'hx %s1', block = true, desc = "helix", for = "unix" },
  # { run = 'emacs %s1', block = true, desc = "emacs", for = "unix" },
  # { run = 'micro %s1', block = true, desc = "micro", for = "unix" },
  # ==== Windows ====
  { run = '%EDITOR% %s1', block = true, desc = "$EDITOR", for = "windows" },
  { run = 'vim %s1', block = true, desc = "vim", for = "windows" },
  { run = 'nvim %s1', block = true, desc = "nvim", for = "windows" },
  { run = 'emeditor %s1', blcok = true, desc = "emeditor", for = "windows" },
  # { run = 'notepad %s1', orphan = true, desc = "notepad", for = "windows" },
  # { run = 'zed %s1', orphan = true, desc = "zed", for = "windows" },
  { run = 'code %s1', orphan = true, desc = "vscode", for = "windows" },
  # { run = 'code -w %s1', block = true, desc = "vscode (block)", for = "windows" },
  # { run = 'vi %s1', block = true, desc = "vi", for = "windows" },
  # { run = 'hx %s1', block = true, desc = "helix", for = "windows" },
  # { run = 'micro %s1', block = true, desc = "micro", for = "windows" },
  # { run = 'emacs %s1', block = true, desc = "emacs", for = "windows" },
]

[plugin]
prepend_preloaders = [
  # ======= MediaInfo Plugin =======
  # Replace magick, image, video with mediainfo
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },
  # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
  { mime = "application/postscript", run = "mediainfo" },
]
prepend_previewers = [
  # ======= MediaInfo Plugin =======
  # There are more extensions which are supported by mediainfo.
  # Just add file's MIME type to `previewers`, `preloaders` above.
  # https://mediaarea.net/en/MediaInfo/Support/Formats
  # Replace magick, image, video with mediainfo
  { mime = "{audio,video,image}/*", run = "mediainfo"},
  { mime = "application/subrip", run = "mediainfo" },
  # Adobe Illustrator, Adobe Photoshop is image/adobe.photoshop, already handled above
  { mime = "application/postscript", run = "mediainfo" },
]

[tasks]
# image_alloc      = 1073741824        # = 1024*1024*1024 = 1024MB
# For a large file like Adobe Illustrator, Adobe Photoshop, etc
# you may need to increase the memory limit if no image is rendered.
# https://yazi-rs.github.io/docs/configuration/yazi#tasks
