version: "3"
run: "always" # "always" | "once" | "when_changed"
method: "checksum" # "checksum" | "timestamp" | "none"
interval: "5s"
# set:
#   - -e # Exit immediately if command returns a non-zero status
#   - -x # Print commands
# shopt:
#   - -s
#   - dotglob
silent: false
output: "interleaved" # "interleaved" | "group" | "prefixed"

dotenv:
  - .env
  - .local.env

includes:
  manifest:
    taskfile: "./taskfile.d/manifest.yaml"
    optional: false

tasks:
  default:
    silent: true
    cmds:
      - cmd: task --list-all

  manifest:apt:
    cmds:
      - vars:
          MANIFEST: "./manifests/apt.yaml"
          CALL: "apt:apply"
        task: manifest:dispatch

  manifest:ansible-collection:
    platforms: [linux, darwin]
    cmds:
      - vars:
          MANIFEST: "./manifests/ansible-collection.yaml"
          CALL: "ansible-collection:apply"
        task: manifest:dispatch

  manifest:ansible-role:
    platforms: [linux, darwin]
    cmds:
