version: "3"

includes:
  receivers:
    taskfile: "./receivers.yaml"
    flatten: true

tasks:
  dispatch:
    desc: "dispatch manifest items to CALLS kind=task receivers"
    requires:
      vars:
        - MANIFEST
        - CALLS
    vars:
      _YAML:
        sh: 'printf "%s" "$(< "{{.MANIFEST}}")"'
      _MANIFEST:
        ref: 'fromYaml ._YAML'
      _DISPATCH_JSON: >-
        {{ $m := ._MANIFEST | default dict }}{{ $n := 0 }}[{{ $first := true }}
        {{- if not (eq (printf "%T" $m) "map[string]interface {}") }}{{ fail (printf "manifest is not a map in %s" $.MANIFEST) }}{{ end }}
        {{- range $k, $v := $m }}
        {{-   if not (or (eq $k "items") (eq $k "groups")) }}{{ fail (printf "item #1 unknown top-level key '%s' in %s" $k $.MANIFEST) }}{{ end }}
        {{- end }}
        {{- $g := $m.groups | default dict }}
        {{- range $m.items | default list }}
        {{-   if not (eq (printf "%T" .) "map[string]interface {}") }}{{ fail (printf "item #%d not a map in %s" (add $n 1) $.MANIFEST) }}{{ end }}
        {{-   if hasKey . "group" }}
        {{-     $grp := .group }}
        {{-     if not (hasKey $g $grp) }}{{ fail (printf "item #%d unknown group '%s' in %s" (add $n 1) $grp $.MANIFEST) }}{{ end }}
        {{-     $defaults := dict }}
        {{-     range $k, $v := . }}
        {{-       if not (or (eq $k "group") (eq $k "platforms") (eq $k "kind")) }}{{ $defaults = merge (dict $k $v) $defaults }}{{ end }}
        {{-     end }}
        {{-     $refPMatch := true }}
        {{-     if hasKey . "platforms" }}
        {{-       $refPMatch = false }}
        {{-       if not (or (eq (printf "%T" .platforms) "string") (eq (printf "%T" .platforms) "[]interface {}")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" (add $n 1) .platforms $.MANIFEST) }}{{ end }}
        {{-       $refPJs := toJson .platforms }}
        {{-       if eq (printf "%T" .platforms) "string" }}{{ $refPJs = printf "[%s]" $refPJs }}{{ end }}
        {{-       range fromJson $refPJs }}
        {{-         if not (eq (printf "%T" .) "string") }}{{ fail (printf "item #%d invalid platform '%v' in %s" (add $n 1) . $.MANIFEST) }}{{ end }}
        {{-         $refParts := splitList "/" . }}
        {{-         if not (or (eq (index $refParts 0) "windows") (eq (index $refParts 0) "linux") (eq (index $refParts 0) "darwin")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" (add $n 1) . $.MANIFEST) }}{{ end }}
        {{-         if or (gt (len $refParts) 2) (and (eq (len $refParts) 2) (eq (index $refParts 1) "")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" (add $n 1) . $.MANIFEST) }}{{ end }}
        {{-         $refM := eq (index $refParts 0) (OS) }}
        {{-         if eq (len $refParts) 2 }}{{ $refM = and $refM (and (ne (index $refParts 1) "") (eq (index $refParts 1) (ARCH))) }}{{ end }}
        {{-         if $refM }}{{ $refPMatch = true }}{{ end }}
        {{-       end }}
        {{-     end }}
        {{-     if $refPMatch }}
        {{-       range index $g $grp }}
        {{-         $n = add $n 1 }}
        {{-         if not (eq (printf "%T" .) "map[string]interface {}") }}{{ fail (printf "item #%d not a map in %s" $n $.MANIFEST) }}{{ end }}
        {{-         if hasKey . "group" }}{{ fail (printf "item #%d nested group '%s' in %s" $n .group $.MANIFEST) }}{{ end }}
        {{-         if not (hasKey . "kind") }}{{ fail (printf "item #%d missing or non-scalar kind in %s" $n $.MANIFEST) }}{{ end }}
        {{-         if not (eq (printf "%T" .kind) "string") }}{{ fail (printf "item #%d missing or non-scalar kind in %s" $n $.MANIFEST) }}{{ end }}
        {{-         $pMatch := true }}
        {{-         if hasKey . "platforms" }}
        {{-           $pMatch = false }}
        {{-           if not (or (eq (printf "%T" .platforms) "string") (eq (printf "%T" .platforms) "[]interface {}")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n .platforms $.MANIFEST) }}{{ end }}
        {{-           $pJs := toJson .platforms }}
        {{-           if eq (printf "%T" .platforms) "string" }}{{ $pJs = printf "[%s]" $pJs }}{{ end }}
        {{-           range fromJson $pJs }}
        {{-             if not (eq (printf "%T" .) "string") }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n . $.MANIFEST) }}{{ end }}
        {{-             $parts := splitList "/" . }}
        {{-             if not (or (eq (index $parts 0) "windows") (eq (index $parts 0) "linux") (eq (index $parts 0) "darwin")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n . $.MANIFEST) }}{{ end }}
        {{-             if or (gt (len $parts) 2) (and (eq (len $parts) 2) (eq (index $parts 1) "")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n . $.MANIFEST) }}{{ end }}
        {{-             $pm := eq (index $parts 0) (OS) }}
        {{-             if eq (len $parts) 2 }}{{ $pm = and $pm (and (ne (index $parts 1) "") (eq (index $parts 1) (ARCH))) }}{{ end }}
        {{-             if $pm }}{{ $pMatch = true }}{{ end }}
        {{-           end }}
        {{-         end }}
        {{-         $item := . }}
        {{-         range $k, $v := $defaults }}
        {{-           if not (hasKey $item $k) }}{{ $item = merge (dict $k $v) $item }}{{ end }}
        {{-         end }}
        {{-         if $pMatch }}{{ if not $first }},{{ end }}{{ $first = false }}{{ toJson $item }}{{ end }}
        {{-       end }}
        {{-     end }}
        {{-   else }}
        {{-     $n = add $n 1 }}
        {{-     if not (hasKey . "kind") }}{{ fail (printf "item #%d missing or non-scalar kind in %s" $n $.MANIFEST) }}{{ end }}
        {{-     if not (eq (printf "%T" .kind) "string") }}{{ fail (printf "item #%d missing or non-scalar kind in %s" $n $.MANIFEST) }}{{ end }}
        {{-     $pMatch := true }}
        {{-     if hasKey . "platforms" }}
        {{-       $pMatch = false }}
        {{-       if not (or (eq (printf "%T" .platforms) "string") (eq (printf "%T" .platforms) "[]interface {}")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n .platforms $.MANIFEST) }}{{ end }}
        {{-       $pJs := toJson .platforms }}
        {{-       if eq (printf "%T" .platforms) "string" }}{{ $pJs = printf "[%s]" $pJs }}{{ end }}
        {{-       range fromJson $pJs }}
        {{-         if not (eq (printf "%T" .) "string") }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n . $.MANIFEST) }}{{ end }}
        {{-         $parts := splitList "/" . }}
        {{-         if not (or (eq (index $parts 0) "windows") (eq (index $parts 0) "linux") (eq (index $parts 0) "darwin")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n . $.MANIFEST) }}{{ end }}
        {{-         if or (gt (len $parts) 2) (and (eq (len $parts) 2) (eq (index $parts 1) "")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n . $.MANIFEST) }}{{ end }}
        {{-             $pm := eq (index $parts 0) (OS) }}
        {{-             if eq (len $parts) 2 }}{{ $pm = and $pm (and (ne (index $parts 1) "") (eq (index $parts 1) (ARCH))) }}{{ end }}
        {{-             if $pm }}{{ $pMatch = true }}{{ end }}
        {{-       end }}
        {{-     end }}
        {{-     if $pMatch }}{{ if not $first }},{{ end }}{{ $first = false }}{{ toJson . }}{{ end }}
        {{-   end }}
        {{- end }}]
      _DISPATCH:
        ref: 'fromJson ._DISPATCH_JSON'
      _CALLS_LIST: >-
        {{ $calls := splitList "," (.CALLS | toString) }}{{ range $c := $calls }}{{ $e := trimAll " " $c }}{{ if eq $e "" }}{{ fail (printf "invalid CALLS entry '%s'" $c) }}{{ end }}{{ $kv := splitList "=" $e }}{{ if ne (len $kv) 2 }}{{ fail (printf "invalid CALLS entry '%s'" $c) }}{{ end }}{{ if or (eq (trimAll " " (index $kv 0)) "") (eq (trimAll " " (index $kv 1)) "") }}{{ fail (printf "invalid CALLS entry '%s'" $c) }}{{ end }}{{ end }}{{ toJson $calls }}
      _ROUTES_JSON: >-
        {{ $items := ._DISPATCH }}{{ $calls := fromJson ._CALLS_LIST }}{{ $first := true }}[{{ range $c := $calls }}{{ $e := trimAll " " $c }}{{ $kv := splitList "=" $e }}{{ $kind := trimAll " " (index $kv 0) }}{{ $task := trimAll " " (index $kv 1) }}{{ range $it := $items }}{{ if eq (index $it "kind") $kind }}{{ if not $first }},{{ end }}{{ $first = false }}{{ printf "{\"task\":%s,\"item\":%s}" (toJson $task) (toJson $it) }}{{ end }}{{ end }}{{ end }}]
      _ROUTES:
        ref: 'fromJson ._ROUTES_JSON'
      _UNCLAIMED: >-
        {{ $items := ._DISPATCH }}{{ $calls := fromJson ._CALLS_LIST }}{{ $claimed := dict }}{{ range $c := $calls }}{{ $kv := splitList "=" (trimAll " " $c) }}{{ $claimed = merge (dict (trimAll " " (index $kv 0)) true) $claimed }}{{ end }}{{ range $i, $it := $items }}{{ if not (hasKey $claimed (index $it "kind")) }}{{ printf "item #%d unclaimed kind %s in %s\n" (add $i 1) (index $it "kind") $.MANIFEST }}{{ end }}{{ end }}
      _FAIL_LOG:
        sh: 'printf "%s" "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog"'
    # kind 可能含单引号，unclaimed 行经 env 双引号展开避免破坏 shell 引用
    env:
      _UNCLAIMED_TXT: '{{ ._UNCLAIMED }}'
    cmds:
      - cmd: ': > "{{ ._FAIL_LOG }}"'
      - cmd: 'if [ -n "$_UNCLAIMED_TXT" ]; then printf ''%s'' "$_UNCLAIMED_TXT" >> "{{ ._FAIL_LOG }}"; fi'
      - for: { var: _ROUTES, as: _R }
        task: '{{ ._R.task }}'
        vars:
          ITEM_JSON: '{{ toJson ._R.item }}'
          FAIL_LOG: "{{ ._FAIL_LOG }}"
      - cmd: 'if [ -s "{{ ._FAIL_LOG }}" ]; then echo ''manifest:dispatch: failed items:''; while IFS= read -r l; do printf ''  %s\n'' "$l"; done < "{{ ._FAIL_LOG }}"; exit 1; fi'
