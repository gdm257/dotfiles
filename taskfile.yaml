version: "3"
run: "always" # "always" | "once" | "when_changed"
method: "checksum" # "checksum" | "timestamp" | "none"
interval: "5s"
# set:
#   - -e # Exit immediately if command returns a non-zero status
#   - -x # Print commands
# shopt:
#   - -s
#   - dotglob
silent: false
output: "interleaved" # "interleaved" | "group" | "prefixed"

dotenv:
  - .env
  - .local.env

includes:
  manifest:
    taskfile: "./taskfile.d/manifest.yaml"
    optional: false

tasks:
  default:
    silent: true
    cmds:
      - cmd: task --list-all

  dotbot:age:
    cmds:
      - dotbot -v -d . -c ./dotbot-configs/age.yaml

  dotbot:libs:
    cmds:
      - dotbot -v -d . -c ./dotbot-configs/once.lib.yaml

  dotbot:links:
    cmds:
      - dotbot -v -d . -c ./dotbot-configs/links.yaml

  dotbot:registry:
    cmds:
      - dotbot -v -d . -c ./dotbot-configs/registry.yaml

  dotbot:scoop:
    cmds:
      - dotbot -v -d . -c ./dotbot-configs/scoop.yaml

  dotbot:test-plugins:
    cmds:
      - dotbot -v -d . -c ./dotbot-configs/test-plugins.yaml

  manifests:ansible-collection:install:
    platforms: [linux, darwin]
    cmds:
      - task: manifest:dispatch
        vars:
          CALLS: "ansible-collection=ansible-collection:install"
          MANIFEST: "./manifests/ansible-collection.yaml"

  manifests:ansible-role:install:
    platforms: [linux, darwin]
    cmds:
      - task: manifest:dispatch
        vars:
          CALLS: "ansible-role=ansible-role:install"
          MANIFEST: "./manifests/ansible-role.yaml"

  manifests:app:audio:install:
