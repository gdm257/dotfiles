  choco:install:
    desc: "receive choco-package items (install; absent belongs to choco:uninstall)"
    requires:
      vars:
        - ITEM_JSON
    vars:
      ITEM:
        ref: 'fromJson .ITEM_JSON'
      _CMD: '{{ if eq .ITEM.kind "choco-package" }}{{ if eq (.ITEM.state | default "present") "present" }}choco install -y {{ .ITEM.name }}{{ else }}echo "choco:install: unexpected state {{ .ITEM.state }} for {{ .ITEM.kind }}" >&2 && exit 1{{ end }}{{ else }}echo "choco:install: unknown kind {{ .ITEM.kind }}" >&2 && exit 1{{ end }}'
      _CONTINUE: '{{ if hasKey .ITEM "continue_on_error" }}{{ if eq .ITEM.continue_on_error true }}true{{ end }}{{ else if eq (.CONTINUE_ON_ERROR | default "") "true" }}true{{ end }}'
      _FAIL_LOG: '{{ .FAIL_LOG | default "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog" }}'
    cmds:
      - cmd: '{{ if eq ._CONTINUE "true" }}{{ ._CMD }} || { echo "failed: {{ ._CMD }}" >> "{{ ._FAIL_LOG }}"; }{{ else }}{{ ._CMD }}{{ end }}'

  choco:uninstall:
    desc: "receive choco-package items (uninstall; absent direction)"
    requires:
      vars:
        - ITEM_JSON
    vars:
      ITEM:
        ref: 'fromJson .ITEM_JSON'
      _CMD: '{{ if eq .ITEM.kind "choco-package" }}{{ if eq .ITEM.state "absent" }}if choco list --exact {{ .ITEM.name }} >/dev/null 2>&1; then choco uninstall -y {{ .ITEM.name }}; fi{{ else }}echo "choco:uninstall: unexpected state {{ .ITEM.state | default "present" }} for {{ .ITEM.kind }}" >&2 && exit 1{{ end }}{{ else }}echo "choco:uninstall: unknown kind {{ .ITEM.kind }}" >&2 && exit 1{{ end }}'
      _CONTINUE: '{{ if hasKey .ITEM "continue_on_error" }}{{ if eq .ITEM.continue_on_error true }}true{{ end }}{{ else if eq (.CONTINUE_ON_ERROR | default "") "true" }}true{{ end }}'
      _FAIL_LOG: '{{ .FAIL_LOG | default "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog" }}'
    cmds:
      - cmd: '{{ if eq ._CONTINUE "true" }}{{ ._CMD }} || { echo "failed: {{ ._CMD }}" >> "{{ ._FAIL_LOG }}"; }{{ else }}{{ ._CMD }}{{ end }}'

