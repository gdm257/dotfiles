# KeySteer user overrides. Full defaults: keysteer --dump-config
# A bindings table replaces that mode's defaults; keep the keys you need.

[hotkeys]
"primary+q" = "normal"

[normal.bindings]
"?" = "key_help"
'\' = "text_input"
"e i" = "move_up"
"d k" = "move_down"
"s j" = "move_left"
"f l" = "move_right"
caps_lock = "precision"
left_shift = "slow"
"z ," = "wheel_up"
"x ." = "wheel_down"
"w u" = "scroll_left"
"r o" = "scroll_right"
"space c m" = "left_click"
"a ;" = "right_click"
"b /" = "middle_click"
"v n" = "toggle"
g = "grid"
"primary+g" = "recursive_grid"
"t y" = "ui_hint"
"primary+c" = "text_select"
"primary+f" = "bisect"
"primary+s" = "screen next"
"primary+d" = "move_window next"
"primary+w" = "window"
"q p esc" = "idle"

[pointer]
initial_speed = 1300.0

[ui_hint]
hint_characters = "sdfwegrta"
scan_scope = "active"

[recursive_grid]
keys = "wersdfxcv"
