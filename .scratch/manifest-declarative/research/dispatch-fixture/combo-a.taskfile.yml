version: "3"

vars:
  MANIFEST: sample.manifest.yaml
  _YAML:
    sh: 'printf "%s" "$(< "{{.MANIFEST}}")"'
  _MANIFEST:
    ref: "fromYaml ._YAML"
  ITEMS:
    ref: "._MANIFEST.items"

tasks:
  dispatch:
    cmds:
      - for: { var: ITEMS, as: ITEM }
        task: recv
        vars:
          ITEM:
            ref: .ITEM

  recv:
    internal: true
    cmds:
      - echo "json={{toJson .ITEM}}"
      - echo "name={{.ITEM.name}}"
      - echo "sudo={{if .ITEM.sudo}}yes{{else}}no{{end}}"
      - echo "version={{.ITEM.version}}"
      - echo "absent={{.ITEM.absent}}"
