  scoop:install:
    desc: "receive scoop items (app install, bucket/config; absent belongs to scoop:uninstall)"
    requires:
      vars:
        - ITEM_JSON
    vars:
      ITEM:
        ref: 'fromJson .ITEM_JSON'
      _CMD: '{{ if eq .ITEM.kind "scoop-app" }}{{ if eq (.ITEM.state | default "present") "present" }}{{ if eq (.ITEM.elevated | default false) true }}sudo {{ end }}scoop install {{ .ITEM.name }}{{ else }}echo "scoop:install: unexpected state {{ .ITEM.state }} for {{ .ITEM.kind }}" >&2 && exit 1{{ end }}{{ else if eq .ITEM.kind "scoop-bucket" }}{{ if hasKey .ITEM "state" }}echo "scoop:install: unexpected state {{ .ITEM.state }} for {{ .ITEM.kind }}" >&2 && exit 1{{ else }}scoop bucket add {{ .ITEM.name }}{{ if .ITEM.url }} {{ .ITEM.url }}{{ end }}{{ end }}{{ else if eq .ITEM.kind "scoop-config" }}{{ if hasKey .ITEM "state" }}echo "scoop:install: unexpected state {{ .ITEM.state }} for {{ .ITEM.kind }}" >&2 && exit 1{{ else }}scoop config {{ .ITEM.key }} {{ .ITEM.value }}{{ end }}{{ else }}echo "scoop:install: unknown kind {{ .ITEM.kind }}" >&2 && exit 1{{ end }}'
      _CONTINUE: '{{ if hasKey .ITEM "continue_on_error" }}{{ if eq .ITEM.continue_on_error true }}true{{ end }}{{ else if eq (.CONTINUE_ON_ERROR | default "") "true" }}true{{ end }}'
