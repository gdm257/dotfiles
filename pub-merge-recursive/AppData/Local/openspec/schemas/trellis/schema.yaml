name: trellis
version: 1
description: Trellis workflow - memories → prd → design → specs → implement; planning files live in .trellis/tasks/<task>/
artifacts:
  - id: memories
    generates: memories.md
    description: Gather context from repo-scoped docs related to this change
    template: memories.md
    instruction: |
      Gather not-loaded context if it exists; missing sources are skipped silently, never created.
      - Glossary: if `CONTEXT-MAP.md` exists at the repo root, read it and every
        `CONTEXT.md` it points to that is relevant to this change; otherwise read
        the root `CONTEXT.md`. Use its canonical terms verbatim when writing the
        artifacts below.
      - ADRs: read every ADR in `docs/adr/` that touches the area of this change
        (in a multi-context repo, also `<context-root>/docs/adr/` for each context
        the change touches). Treat them as standing decisions; when a later
        artifact's decision contradicts one, surface the conflict explicitly
        instead of silently overriding it.
      - openspec: run `openspec list --specs` for the capability inventory, then
        `openspec show "<spec-id>" --type spec --json --no-scenarios` for each spec
        that looks related to this change.
      - Trellis specs: if `.trellis/spec/` exists, list it to discover the layout
        (`<layer>/index.md` or `<package>/<layer>/index.md`, plus `guides/`), read
        `guides/index.md` and the index of every layer this change touches, and
        follow the guideline files those indexes point to. Treat them as hard
        constraints on later artifacts.

      Generate artifact.
    requires: []

  - id: prd
    generates: prd.md
    description: Trellis task PRD created via trellis-runtime
    template: prd.md
    instruction: |
      Create the Trellis task and write its PRD. The change dir keeps only a
      pointer stub; the real planning files live in the task directory.

      Precondition: `.trellis/` must exist at the repo root and trellis-runtime
      must have a developer identity - check with `uvx trellis-runtime
      get-developer`. If `.trellis/` is missing, stop and tell the user; do not
      initialize it yourself. If the developer is not initialized, tell the
      user to run `uvx trellis-runtime init-developer <name>` with their
      `git config user.name`.

      Create the task directory with trellis-runtime (never the `trellis` npm
      command): `uvx trellis-runtime task create "<title>" --slug <name>`. The
      slug must not include the `MM-DD-` date prefix; it is added automatically.

      Write `.trellis/tasks/<task>/prd.md` with these sections:
      - **Goal**: what this change achieves and why now.
      - **Confirmed Facts**: verified repo and user state the plan relies on.
      - **Requirements**: numbered, testable statements.
      - **Acceptance Criteria**: observable checks, each traceable to a requirement.
      - **Out of Scope**: explicit non-goals.
      - **Open Questions**: unknowns that must be resolved before design; omit if none.

      Generate artifact.
    requires:
      - memories

  - id: design
    generates: design.md
    description: Technical design in the Trellis task directory
    template: design.md
    instruction: |
      Write the technical design for the Trellis task at
      `.trellis/tasks/<task>/design.md`. The change dir keeps only a pointer
      stub; the real file lives in the task directory.

      Cover, as the change warrants:
      - Architecture and boundaries - what changes, what stays untouched.
      - Data flow and contracts - interfaces, schemas, storage.
      - Compatibility and migration - what existing behavior must survive.
      - Key trade-offs - alternatives considered and why this approach wins.

      Lightweight changes may skip substantive content: restate the approach in a
      few lines, note anything the PRD left undecided, and move on. The artifact
      must exist either way so the implement plan can build on it.

      Generate artifact.
    requires:
      - prd

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization; do not add a new domain level when the project uses a flat layout.
      - Modified capabilities: use the exact existing path from `openspec/specs/<capability-path>/` when creating the delta at `specs/<capability-path>/spec.md`. Run `openspec list --specs` to confirm that path before writing the delta, appending `--store "<id>"` only for a registered standalone store - a mistyped or invented path targets a capability that does not exist rather than the one you meant. Do not move or rename the capability.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). Using 3 hashtags or bullets will fail silently.
      - Every requirement MUST have at least one scenario.

      New capabilities only: start the delta spec with a `## Purpose` section -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from `--store`, a project `store:` pointer, or a global default
      store - and to the current repository otherwise. Do not try to work out
      which case applies; the field already has.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so it opens with `## Purpose`):
      ```
      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - prd

  - id: implement
    generates: implement.md
    description: Implementation checklist in the Trellis task directory
    template: implement.md
    instruction: |
      Write the implementation plan for the Trellis task at
      `.trellis/tasks/<task>/implement.md`. The change dir keeps only a pointer
      stub; the real file lives in the task directory.

      The plan is an ordered checklist:
      - Every step is a checkbox: `- [ ]`.
      - Each step states how to verify it - the validation command to run
        (lint, typecheck, tests) or the observable behavior to check.
      - End with a **Risky Files** section listing files where a mistake is
        costly; omit it when nothing is risky.

      Lightweight changes may keep the checklist coarse, but the file must exist
      with at least one checkbox before apply starts.

      Generate artifact.
    requires:
      - design
      - specs

apply:
  requires: [ implement ]
  instruction: |
      Implement this change's tasks yourself; do not dispatch sub-agents.
      First activate the Trellis task: run `uvx trellis-runtime task start
      <task-dir>` with the task directory the prd artifact points to (skip
      if it is already active). `start` is idempotent. If it errors with a
      session-identity hint, follow the hint, then retry.
      Before writing code:
      - Read every file in `contextFiles` from `openspec instructions apply --json`.
      - If `.trellis/workflow.md` exists, read it.
      - If `.trellis/spec/` exists, load it: run `uvx trellis-runtime
        get-context --mode packages`, read the index.md of every spec layer
        this change touches plus `.trellis/spec/guides/index.md`, then read
        the guideline files those indexes point to. If the
        `trellis-before-dev` skill is available, you may call it instead of
        doing this manually.
      - Read the change's design and implementation-plan artifacts when present.
      For non-trivial changes, state the change boundary before writing code.
      Then, for each pending task in order:
      - Follow existing code patterns; implement only what the task requires.
      - Verify with the project's lint and typecheck commands; fix failures
        before moving to the next task.
      - Mark the task complete in the tasks file as you go.
      Pause on blockers, unclear tasks, or issues that need artifact updates.
      Never run `git commit`, `git push`, or `git merge`; committing happens
      outside apply.
