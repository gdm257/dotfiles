version: "3"

includes:
  manifest: ../../taskfile.d/manifest.yaml

tasks:
  shell:
    cmds:
      - task: manifest:shell:run
        vars:
          ITEM_JSON: '{{ .ITEM_JSON }}'

  shell:fail-log:
    cmds:
      - cmd: ': > "{{ .FAIL_LOG }}"'
      - task: manifest:shell:run
        vars:
          ITEM_JSON: '{"kind":"shell","cmd":"false","continue_on_error":true}'
          FAIL_LOG: '{{ .FAIL_LOG }}'
      - cmd: 'while IFS= read -r line; do printf "%s\n" "$line"; done < "{{ .FAIL_LOG }}"'
