# KeySteer user overrides. Full defaults: keysteer --dump-config
# A bindings table replaces that mode's defaults; keep the keys you need.

[pointer]
initial_speed = 1200.0

[hotkeys]
"primary+w" = "window"
"primary+q" = "normal"

[key_help]
window_key_help = false

[normal.bindings]
"?" = "key_help"
'\' = "text_input"
"e i arrow_up" = "move_up"
"d k arrow_down" = "move_down"
"s j arrow_left" = "move_left"
"f l arrow_right" = "move_right"
caps_lock = "precision"
left_shift = "slow"
"z ," = "wheel_up"
"x ." = "wheel_down"
"w u" = "scroll_left"
"r o" = "scroll_right"
"space c m" = "left_click"
"a ;" = "right_click"
"b /" = "middle_click"
"v n" = "toggle"
g = "grid"
"primary+g" = "recursive_grid"
"t y" = "ui_hint"
"primary+c" = "text_select"
"primary+f" = "bisect"
"primary+s" = "screen next"
"primary+d" = "move_window next"
"primary+w" = "window"
"q p esc" = "idle"

[ui_hint]
hint_characters = "sdfwegrta"
# scan_scope = "active"

[recursive_grid]
keys = "wersdfxcv"

[bisect.bindings]
"e i arrow_up" = "bisect_up"
"d k arrow_down" = "bisect_down"
"s j arrow_left" = "bisect_left"
"f l arrow_right" = "bisect_right"
enter = "confirm_selection"
esc = "cancel_selection"
"tab backspace" = "previous_level"
space = "first_level"
"`" = "follow"
"primary+q" = "normal"

[text_select]
hint_characters = "trsdwegf"

[window.bindings]
"?" = "key_help"
"primary+q q p esc" = "idle"
"t y" = "window_editor"
"w o" = "window_quick"
g = "grid"
"primary+g" = "recursive_grid"
"primary+f" = "bisect"
tab = "window_select"
"shift+tab" = "window_select_previous"
"ctrl" = "window_multi_select"
"ctrl+x" = "window_multi_clear"
"e i arrow_up" = "window_up"
"d k arrow_down" = "window_down"
"s j arrow_left" = "window_left"
"f l arrow_right" = "window_right"
a = "window_center"
r = "window_undo"
"shift+r" = "window_redo"
"shift+c" = "window_reset_initial"
v = "window_size"
z = "window_minimize"
x = "window_maximize"
c = "window_close"
"v+d v+k v+arrow_down" = "window_volume_down"
"v+e v+i v+arrow_up" = "window_volume_up"
"v+m" = "window_volume_mute"
"shift+v+m" = "window_system_volume_mute"
"v+s v+j v+arrow_left" = "window_audio_previous"
"v+f v+l v+arrow_right" = "window_audio_next"
"shift+v+d shift+v+k shift+v+arrow_down" = "window_system_volume_down"
"shift+v+e shift+v+i shift+v+arrow_up" = "window_system_volume_up"
"shift+v+s shift+v+j shift+v+arrow_left" = "window_system_audio_previous"
"shift+v+f shift+v+l shift+v+arrow_right" = "window_system_audio_next"

[window_quick.bindings]
"?" = "key_help"
"primary+q" = "idle"
"q p esc" = "window"
"primary+e" = "window_editor"
"e i arrow_up" = "window_layout_up"
"d k arrow_down" = "window_layout_down"
"s j arrow_left" = "window_layout_left"
"f l arrow_right" = "window_layout_right"
c = "window_reset_initial"
"shift+c" = "window_restore"
r = "window_undo"
"shift+r" = "window_redo"
tab = "window_select"
"shift+tab" = "window_select_previous"
"v+j" = "window_volume_down"
"v+k" = "window_volume_up"
"v+m" = "window_volume_mute"
"shift+v+m" = "window_system_volume_mute"
"v+h" = "window_audio_previous"
"v+l" = "window_audio_next"
"shift+v+j" = "window_system_volume_down"
"shift+v+k" = "window_system_volume_up"
"shift+v+h" = "window_system_audio_previous"
"shift+v+l" = "window_system_audio_next"

[window_editor.bindings]
"?" = "key_help"
"primary+q" = "idle"
"q p esc" = "window"
"e i arrow_up" = "window_layout_up"
"d k arrow_down" = "window_layout_down"
"s j arrow_left" = "window_layout_left"
"f l arrow_right" = "window_layout_right"
"shift+e shift+i shift+arrow_up" = "window_split_up"
"shift+d shift+k shift+arrow_down" = "window_split_down"
"shift+s shift+j shift+arrow_left" = "window_split_left"
"shift+f shift+l shift+arrow_right" = "window_split_right"
"ctrl+e ctrl+i ctrl+arrow_up" = "window_ratio_up"
"ctrl+d ctrl+k ctrl+arrow_down" = "window_ratio_down"
"ctrl+s ctrl+j ctrl+arrow_left" = "window_ratio_left"
"ctrl+f ctrl+l ctrl+arrow_right" = "window_ratio_right"
tab = "window_select"
"shift+tab" = "window_select_previous"
"`" = "window_area_number"
r = "window_undo"
"shift+r" = "window_redo"
c = "window_reset_initial"
x = "window_remove_region"
"shift+c" = "window_restore"
"ctrl+shift+s" = "window_save_layout"
"v+j" = "window_volume_down"
"v+k" = "window_volume_up"
"v+m" = "window_volume_mute"
"shift+v+m" = "window_system_volume_mute"
"v+h" = "window_audio_previous"
"v+l" = "window_audio_next"
"shift+v+j" = "window_system_volume_down"
"shift+v+k" = "window_system_volume_up"
"shift+v+h" = "window_system_audio_previous"
"shift+v+l" = "window_system_audio_next"
