version: "3"

tasks:
  ansible-collection:install:
    requires:
      vars: [ITEM_JSON]
    vars:
      ITEM:
        ref: 'fromJson .ITEM_JSON'
      _CMD: '{{ if ne .ITEM.kind "ansible-collection" }}{{ fail (printf "ansible-collection: unknown kind %s" .ITEM.kind) }}{{ end }}ansible-galaxy collection install {{ .ITEM.name }}'
      _CONTINUE: '{{ if hasKey .ITEM "continue_on_error" }}{{ if eq .ITEM.continue_on_error true }}true{{ end }}{{ else if eq (.CONTINUE_ON_ERROR | default "") "true" }}true{{ end }}'
      _FAIL_LOG: '{{ .FAIL_LOG | default "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog" }}'
    cmds:
      - cmd: '{{ if eq ._CONTINUE "true" }}{{ ._CMD }} || { echo "failed: {{ ._CMD }}" >> "{{ ._FAIL_LOG }}"; }{{ else }}{{ ._CMD }}{{ end }}'

  ansible-role:install:
    requires:
      vars: [ITEM_JSON]
    vars:
      ITEM:
        ref: 'fromJson .ITEM_JSON'
      _CMD: '{{ if ne .ITEM.kind "ansible-role" }}{{ fail (printf "ansible-role: unknown kind %s" .ITEM.kind) }}{{ end }}ansible-galaxy role install {{ .ITEM.name }}'
      _CONTINUE: '{{ if hasKey .ITEM "continue_on_error" }}{{ if eq .ITEM.continue_on_error true }}true{{ end }}{{ else if eq (.CONTINUE_ON_ERROR | default "") "true" }}true{{ end }}'
      _FAIL_LOG: '{{ .FAIL_LOG | default "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog" }}'
    cmds:
      - cmd: '{{ if eq ._CONTINUE "true" }}{{ ._CMD }} || { echo "failed: {{ ._CMD }}" >> "{{ ._FAIL_LOG }}"; }{{ else }}{{ ._CMD }}{{ end }}'

  apt:install:
    desc: "receive apt-package items (apt install)"
    requires:
      vars:
        - ITEM_JSON
    vars:
      ITEM:
        ref: 'fromJson .ITEM_JSON'
      _CMD: '{{ if eq .ITEM.kind "apt-package" }}apt install -y {{ .ITEM.name }}{{ else }}echo "apt: unknown kind {{ .ITEM.kind }}" >&2 && exit 1{{ end }}'
      _CONTINUE: '{{ if hasKey .ITEM "continue_on_error" }}{{ if eq .ITEM.continue_on_error true }}true{{ end }}{{ else if eq (.CONTINUE_ON_ERROR | default "") "true" }}true{{ end }}'
      _FAIL_LOG: '{{ .FAIL_LOG | default "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog" }}'
    cmds:
      - cmd: '{{ if eq ._CONTINUE "true" }}{{ ._CMD }} || { echo "failed: {{ ._CMD }}" >> "{{ ._FAIL_LOG }}"; }{{ else }}{{ ._CMD }}{{ end }}'

  astro:add:
