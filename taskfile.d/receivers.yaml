        ref: 'fromJson .ITEM_JSON'
      _CMD: '{{ if ne .ITEM.kind "pipx-package" }}{{ fail "pipx: unexpected kind" }}{{ end }}pipx install{{ if eq (.ITEM.include_deps | default false) true }} --include-deps{{ end }}{{ range .ITEM.preinstall }} --preinstall {{ . }}{{ end }} {{ .ITEM.name }}'
      _CONTINUE: '{{ if hasKey .ITEM "continue_on_error" }}{{ if eq .ITEM.continue_on_error true }}true{{ end }}{{ else if eq (.CONTINUE_ON_ERROR | default "") "true" }}true{{ end }}'
