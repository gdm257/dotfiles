      ITEM:
        ref: 'fromJson .ITEM_JSON'
      _CMD: '{{ if ne .ITEM.kind "astro-integration" }}{{ fail "astro: unexpected kind" }}{{ end }}pnpm run astro -- add {{ .ITEM.name }}'
      _CONTINUE: '{{ if hasKey .ITEM "continue_on_error" }}{{ if eq .ITEM.continue_on_error true }}true{{ end }}{{ else if eq (.CONTINUE_ON_ERROR | default "") "true" }}true{{ end }}'
      _FAIL_LOG: '{{ .FAIL_LOG | default "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog" }}'
    cmds:
      - cmd: '{{ if eq ._CONTINUE "true" }}{{ ._CMD }} || { echo "failed: {{ ._CMD }}" >> "{{ ._FAIL_LOG }}"; }{{ else }}{{ ._CMD }}{{ end }}'

  bin:install:
    requires:
      vars: [ITEM_JSON]
    vars:
      ITEM:
        ref: 'fromJson .ITEM_JSON'
      _CMD: '{{ if ne .ITEM.kind "bin-app" }}{{ fail (printf "bin: unknown kind %s" .ITEM.kind) }}{{ end }}bin install {{ .ITEM.name }}{{ if .ITEM.path }} {{ .ITEM.path }}{{ end }}'
      _CONTINUE: '{{ if hasKey .ITEM "continue_on_error" }}{{ if eq .ITEM.continue_on_error true }}true{{ end }}{{ else if eq (.CONTINUE_ON_ERROR | default "") "true" }}true{{ end }}'
      _FAIL_LOG: '{{ .FAIL_LOG | default "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog" }}'
    cmds:
