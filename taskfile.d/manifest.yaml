version: "3"

tasks:
  run:
    desc: "run single command"
    requires:
      vars:
        - RUN
    vars:
      _CMD: "{{ .RUN.prefix }} {{ .RUN.entrypoint }} {{ .RUN.command }} {{ .RUN.args }} {{ .RUN.suffix }}"
    cmds:
      - cmd: '{{ if eq (._CONTINUE | default "") "true" }}{{ ._CMD }} || { echo "failed: {{ ._CMD }}" >> {{ ._FAIL_LOG }}; }{{ else }}{{ ._CMD }}{{ end }}'

  run:manifest:
    requires:
      vars:
        - MANIFEST
    vars:
      _YAML:
        sh: 'printf "%s" "$(< "{{.MANIFEST}}")"'
      _MANIFEST:
        ref: 'fromYaml ._YAML'
      _RUNS_JSON: >-
        {{ $g := ._MANIFEST.groups | default dict }}[{{ $first := true }}
        {{- range ._MANIFEST.run | default list }}
        {{- if .group }}{{ if not (hasKey $g .group) }}{{ fail (printf "unknown group '%s' in %s" .group $.MANIFEST) }}{{ end }}
        {{-   if ne .enable false }}
        {{-     $coe := .continue_on_error }}
        {{-     range index $g .group }}{{ if .group }}{{ fail (printf "nested group '%s' in %s" .group $.MANIFEST) }}{{ end }}{{ if ne .enable false }}{{ if not $first }},{{ end }}{{ $first = false }}{{ if and $coe (not (hasKey . "continue_on_error")) }}{{ toJson (merge . (dict "continue_on_error" $coe)) }}{{ else }}{{ toJson . }}{{ end }}{{ end }}{{ end }}
        {{-   end }}
        {{- else if ne .enable false }}{{ if not $first }},{{ end }}{{ $first = false }}{{ toJson . }}{{ end }}
        {{- end }}]
      _RUNS:
        ref: 'fromJson ._RUNS_JSON'
      _FAIL_LOG:
        sh: 'f="${TMPDIR:-/tmp}/manifest-faillog"; printf "%s" "${f//\\//}"'
    cmds:
      - cmd: '{{ if (hasKey ._MANIFEST "items") }}{{ fail (printf "v2 manifest (items:) not allowed in v1 engine: %s" .MANIFEST) }}{{ end }}'
      - cmd: ": > {{ ._FAIL_LOG }}"
      - for: { var: _RUNS, as: _RUN }
        task: run
        vars:
          _CONTINUE: '{{ if hasKey ._RUN "continue_on_error" }}{{ if eq ._RUN.continue_on_error true }}true{{ end }}{{ else if eq (.CONTINUE_ON_ERROR | default "") "true" }}true{{ end }}'
          _FAIL_LOG: "{{ ._FAIL_LOG }}"
          RUN:
            map:
              prefix: "{{ if ._RUN.prefix }}{{ ._RUN.prefix }}{{ else if and ._RUN.preset (hasKey (default dict ._MANIFEST.presets) ._RUN.preset) }}{{ default ._MANIFEST.prefix (get (default dict ._MANIFEST.presets) ._RUN.preset).prefix }}{{ else }}{{ ._MANIFEST.prefix }}{{ end }}"
              entrypoint: "{{ if and ._RUN.preset (not (hasKey (default dict ._MANIFEST.presets) ._RUN.preset)) }}{{ fail (printf \"unknown preset '%s' in %s\" ._RUN.preset .MANIFEST) }}{{ else if ._RUN.entrypoint }}{{ ._RUN.entrypoint }}{{ else if ._RUN.preset }}{{ default ._MANIFEST.entrypoint (get (default dict ._MANIFEST.presets) ._RUN.preset).entrypoint }}{{ else }}{{ ._MANIFEST.entrypoint }}{{ end }}"
              command: "{{ if ._RUN.command }}{{ ._RUN.command }}{{ else if and ._RUN.preset (hasKey (default dict ._MANIFEST.presets) ._RUN.preset) }}{{ default ._MANIFEST.command (get (default dict ._MANIFEST.presets) ._RUN.preset).command }}{{ else }}{{ ._MANIFEST.command }}{{ end }}"
              args: "{{ if ._RUN.args }}{{ ._RUN.args }}{{ else if and ._RUN.preset (hasKey (default dict ._MANIFEST.presets) ._RUN.preset) }}{{ default ._MANIFEST.args (get (default dict ._MANIFEST.presets) ._RUN.preset).args }}{{ else }}{{ ._MANIFEST.args }}{{ end }}"
              suffix: "{{ if ._RUN.suffix }}{{ ._RUN.suffix }}{{ else if and ._RUN.preset (hasKey (default dict ._MANIFEST.presets) ._RUN.preset) }}{{ default ._MANIFEST.suffix (get (default dict ._MANIFEST.presets) ._RUN.preset).suffix }}{{ else }}{{ ._MANIFEST.suffix }}{{ end }}"
      - cmd: "if [ -s {{ ._FAIL_LOG }} ]; then echo 'run:manifest: failed items:'; while IFS= read -r l; do printf '  %s\\n' \"$l\"; done < {{ ._FAIL_LOG }}; exit 1; fi"

  windows-feature:apply:
    desc: "receive windows-feature items (dism enable/disable by state)"
    requires:
      vars:
        - ITEM_JSON
    vars:
      ITEM:
        ref: 'fromJson .ITEM_JSON'
      _CMD: '{{ if eq (.ITEM.state | default "enabled") "enabled" }}dism /online /enable-feature /featurename:{{ .ITEM.feature }} /all /norestart{{ else if eq .ITEM.state "disabled" }}dism /online /disable-feature /featurename:{{ .ITEM.feature }} /norestart{{ else }}echo "windows-feature: unknown state {{ .ITEM.state }} for {{ .ITEM.feature }}" >&2 && exit 1{{ end }}'
      _FAIL_LOG:
        sh: 'printf "%s" "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog"'
    cmds:
      - cmd: '{{ if or (eq (.ITEM.continue_on_error | default false) true) (eq (.CONTINUE_ON_ERROR | default "") "true") }}{{ ._CMD }} || { echo "failed: {{ ._CMD }}" >> "{{ ._FAIL_LOG }}"; }{{ else }}{{ ._CMD }}{{ end }}'

  dispatch:
    desc: "dispatch manifest items to CALL task"
    requires:
      vars:
        - MANIFEST
        - CALL
    vars:
      _YAML:
        sh: 'printf "%s" "$(< "{{.MANIFEST}}")"'
      _MANIFEST:
        ref: 'fromYaml ._YAML'
      _DISPATCH_JSON: >-
        {{ $m := ._MANIFEST | default dict }}{{ $n := 0 }}[{{ $first := true }}
        {{- if not (eq (printf "%T" $m) "map[string]interface {}") }}{{ fail (printf "manifest is not a map in %s" $.MANIFEST) }}{{ end }}
        {{- range $k, $v := $m }}
        {{-   if not (or (eq $k "items") (eq $k "groups")) }}{{ fail (printf "unknown top-level key '%s' in %s" $k $.MANIFEST) }}{{ end }}
        {{- end }}
        {{- $g := $m.groups | default dict }}
        {{- range $m.items | default list }}
        {{-   if not (eq (printf "%T" .) "map[string]interface {}") }}{{ fail (printf "item #%d not a map in %s" (add $n 1) $.MANIFEST) }}{{ end }}
        {{-   if hasKey . "group" }}
        {{-     $grp := .group }}
        {{-     if not (hasKey $g $grp) }}{{ fail (printf "unknown group '%s' in %s" $grp $.MANIFEST) }}{{ end }}
        {{-     $coe := .continue_on_error }}
        {{-     $refPass := true }}
        {{-     if not (ne .enable false) }}{{ $refPass = false }}{{ end }}
        {{-     $refPMatch := true }}
        {{-     if hasKey . "platforms" }}
        {{-       $refPMatch = false }}
        {{-       if not (or (eq (printf "%T" .platforms) "string") (eq (printf "%T" .platforms) "[]interface {}")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" (add $n 1) .platforms $.MANIFEST) }}{{ end }}
        {{-       $refPJs := toJson .platforms }}
        {{-       if eq (printf "%T" .platforms) "string" }}{{ $refPJs = printf "[%s]" $refPJs }}{{ end }}
        {{-       range fromJson $refPJs }}
        {{-         if not (eq (printf "%T" .) "string") }}{{ fail (printf "item #%d invalid platform '%v' in %s" (add $n 1) . $.MANIFEST) }}{{ end }}
        {{-         $refParts := splitList "/" . }}
        {{-         if not (or (eq (index $refParts 0) "windows") (eq (index $refParts 0) "linux") (eq (index $refParts 0) "darwin")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" (add $n 1) . $.MANIFEST) }}{{ end }}
        {{-         if gt (len $refParts) 2 }}{{ fail (printf "item #%d invalid platform '%v' in %s" (add $n 1) . $.MANIFEST) }}{{ end }}
        {{-         $refM := eq (index $refParts 0) (OS) }}
        {{-         if eq (len $refParts) 2 }}{{ $refM = and $refM (and (ne (index $refParts 1) "") (eq (index $refParts 1) (ARCH))) }}{{ end }}
        {{-         if $refM }}{{ $refPMatch = true }}{{ end }}
        {{-       end }}
        {{-     end }}
        {{-     $refPass = and $refPass $refPMatch }}
        {{-     if $refPass }}
        {{-       range index $g $grp }}
        {{-         $n = add $n 1 }}
        {{-         if not (eq (printf "%T" .) "map[string]interface {}") }}{{ fail (printf "item #%d not a map in %s" $n $.MANIFEST) }}{{ end }}
        {{-         if hasKey . "group" }}{{ fail (printf "nested group '%s' in %s" .group $.MANIFEST) }}{{ end }}
        {{-         if not (hasKey . "kind") }}{{ fail (printf "item #%d missing or non-scalar kind in %s" $n $.MANIFEST) }}{{ end }}
        {{-         if not (eq (printf "%T" .kind) "string") }}{{ fail (printf "item #%d missing or non-scalar kind in %s" $n $.MANIFEST) }}{{ end }}
        {{-         $pass := true }}
        {{-         if not (ne .enable false) }}{{ $pass = false }}{{ end }}
        {{-         $pMatch := true }}
        {{-         if hasKey . "platforms" }}
        {{-           $pMatch = false }}
        {{-           if not (or (eq (printf "%T" .platforms) "string") (eq (printf "%T" .platforms) "[]interface {}")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n .platforms $.MANIFEST) }}{{ end }}
        {{-           $pJs := toJson .platforms }}
        {{-           if eq (printf "%T" .platforms) "string" }}{{ $pJs = printf "[%s]" $pJs }}{{ end }}
        {{-           range fromJson $pJs }}
        {{-             if not (eq (printf "%T" .) "string") }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n . $.MANIFEST) }}{{ end }}
        {{-             $parts := splitList "/" . }}
        {{-             if not (or (eq (index $parts 0) "windows") (eq (index $parts 0) "linux") (eq (index $parts 0) "darwin")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n . $.MANIFEST) }}{{ end }}
        {{-             if gt (len $parts) 2 }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n . $.MANIFEST) }}{{ end }}
        {{-             $pm := eq (index $parts 0) (OS) }}
        {{-             if eq (len $parts) 2 }}{{ $pm = and $pm (and (ne (index $parts 1) "") (eq (index $parts 1) (ARCH))) }}{{ end }}
        {{-             if $pm }}{{ $pMatch = true }}{{ end }}
        {{-           end }}
        {{-         end }}
        {{-         $pass = and $pass $pMatch }}
        {{-         $item := . }}
        {{-         if and $coe (not (hasKey . "continue_on_error")) }}{{ $item = merge . (dict "continue_on_error" $coe) }}{{ end }}
        {{-         if $pass }}{{ if not $first }},{{ end }}{{ $first = false }}{{ toJson $item }}{{ end }}
        {{-       end }}
        {{-     end }}
        {{-   else }}
        {{-     $n = add $n 1 }}
        {{-     if not (hasKey . "kind") }}{{ fail (printf "item #%d missing or non-scalar kind in %s" $n $.MANIFEST) }}{{ end }}
        {{-     if not (eq (printf "%T" .kind) "string") }}{{ fail (printf "item #%d missing or non-scalar kind in %s" $n $.MANIFEST) }}{{ end }}
        {{-     $pass := true }}
        {{-     if not (ne .enable false) }}{{ $pass = false }}{{ end }}
        {{-     $pMatch := true }}
        {{-     if hasKey . "platforms" }}
        {{-       $pMatch = false }}
        {{-       if not (or (eq (printf "%T" .platforms) "string") (eq (printf "%T" .platforms) "[]interface {}")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n .platforms $.MANIFEST) }}{{ end }}
        {{-       $pJs := toJson .platforms }}
        {{-       if eq (printf "%T" .platforms) "string" }}{{ $pJs = printf "[%s]" $pJs }}{{ end }}
        {{-       range fromJson $pJs }}
        {{-         if not (eq (printf "%T" .) "string") }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n . $.MANIFEST) }}{{ end }}
        {{-         $parts := splitList "/" . }}
        {{-         if not (or (eq (index $parts 0) "windows") (eq (index $parts 0) "linux") (eq (index $parts 0) "darwin")) }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n . $.MANIFEST) }}{{ end }}
        {{-         if gt (len $parts) 2 }}{{ fail (printf "item #%d invalid platform '%v' in %s" $n . $.MANIFEST) }}{{ end }}
        {{-             $pm := eq (index $parts 0) (OS) }}
        {{-             if eq (len $parts) 2 }}{{ $pm = and $pm (and (ne (index $parts 1) "") (eq (index $parts 1) (ARCH))) }}{{ end }}
        {{-             if $pm }}{{ $pMatch = true }}{{ end }}
        {{-       end }}
        {{-     end }}
        {{-     $pass = and $pass $pMatch }}
        {{-     if $pass }}{{ if not $first }},{{ end }}{{ $first = false }}{{ toJson . }}{{ end }}
        {{-   end }}
        {{- end }}]
      _DISPATCH:
        ref: 'fromJson ._DISPATCH_JSON'
      _FAIL_LOG:
        sh: 'printf "%s" "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog"'
    cmds:
      - cmd: ': > "{{ ._FAIL_LOG }}"'
      - for: { var: _DISPATCH, as: _ITEM }
        task: '{{.CALL}}'
        vars:
          ITEM_JSON: "{{toJson ._ITEM}}"
          FAIL_LOG: "{{ ._FAIL_LOG }}"
      - cmd: 'if [ -s "{{ ._FAIL_LOG }}" ]; then echo ''manifest:dispatch: failed items:''; while IFS= read -r l; do printf ''  %s\n'' "$l"; done < "{{ ._FAIL_LOG }}"; exit 1; fi'

  shell:apply:
    desc: "dispatch shell item"
    requires:
      vars:
        - ITEM_JSON
        - FAIL_LOG
    vars:
      _ITEM:
        ref: 'fromJson .ITEM_JSON'
      _CMD: "{{ ._ITEM.cmd }}"
      _CONTINUE: '{{ if hasKey ._ITEM "continue_on_error" }}{{ if eq ._ITEM.continue_on_error true }}true{{ end }}{{ else if eq (.CONTINUE_ON_ERROR | default "") "true" }}true{{ end }}'
    cmds:
      - cmd: '{{ if eq (._CONTINUE | default "") "true" }}{{ ._CMD }} || { echo "failed: {{ ._CMD }}" >> {{ .FAIL_LOG }}; }{{ else }}{{ ._CMD }}{{ end }}'

  scoop:apply:
    desc: "receive scoop items (app/bucket/config by kind)"
    requires:
      vars:
        - ITEM_JSON
    vars:
      ITEM:
        ref: 'fromJson .ITEM_JSON'
      _CMD: '{{ if eq .ITEM.kind "scoop-app" }}{{ if eq (.ITEM.elevated | default false) true }}sudo {{ end }}scoop install {{ .ITEM.name }}{{ else if eq .ITEM.kind "scoop-bucket" }}scoop bucket add {{ .ITEM.name }}{{ if .ITEM.url }} {{ .ITEM.url }}{{ end }}{{ else if eq .ITEM.kind "scoop-config" }}scoop config {{ .ITEM.key }} {{ .ITEM.value }}{{ else }}echo "scoop: unknown kind {{ .ITEM.kind }}" >&2 && exit 1{{ end }}'
      _FAIL_LOG:
        sh: 'printf "%s" "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog"'
    cmds:
      - cmd: '{{ if or (eq (.ITEM.continue_on_error | default false) true) (eq (.CONTINUE_ON_ERROR | default "") "true") }}{{ ._CMD }} || { echo "failed: {{ ._CMD }}" >> "{{ ._FAIL_LOG }}"; }{{ else }}{{ ._CMD }}{{ end }}'

  echo:apply:
    desc: "replay receiver for dispatch fixtures: echo item evidence, fail on fail: true"
    internal: true
    requires:
      vars:
        - ITEM_JSON
    vars:
      ITEM:
        ref: 'fromJson .ITEM_JSON'
      _FAIL_LOG: '{{ .FAIL_LOG | default "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog" }}'
      _CMD: '{{ if .ITEM.fail }}false{{ else }}echo ''item={{ .ITEM.name }} kind={{ .ITEM.kind }} flag={{ if .ITEM.flag }}true{{ else }}false{{ end }} json={{ toJson .ITEM }}''{{ end }}'
    cmds:
      - cmd: '{{ if or (eq (.ITEM.continue_on_error | default false) true) (eq (.CONTINUE_ON_ERROR | default "") "true") }}{{ ._CMD }} || { echo "failed: {{ .ITEM.name }}" >> "{{ ._FAIL_LOG }}"; }{{ else }}{{ ._CMD }}{{ end }}'

  apt:apply:
    desc: "receive apt-package items (apt install)"
    requires:
      vars:
        - ITEM_JSON
    vars:
      ITEM:
        ref: 'fromJson .ITEM_JSON'
      _CMD: '{{ if eq .ITEM.kind "apt-package" }}apt install -y {{ .ITEM.name }}{{ else }}echo "apt: unknown kind {{ .ITEM.kind }}" >&2 && exit 1{{ end }}'
      _FAIL_LOG:
        sh: 'printf "%s" "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog"'
    cmds:
      - cmd: '{{ if or (eq (.ITEM.continue_on_error | default false) true) (eq (.CONTINUE_ON_ERROR | default "") "true") }}{{ ._CMD }} || { echo "failed: {{ ._CMD }}" >> "{{ ._FAIL_LOG }}"; }{{ else }}{{ ._CMD }}{{ end }}'

  yum:apply:
    desc: "receive yum-package items (yum groupinstall)"
    requires:
      vars:
        - ITEM_JSON
    vars:
      ITEM:
        ref: 'fromJson .ITEM_JSON'
      _CMD: '{{ if eq .ITEM.kind "yum-package" }}yum groupinstall {{ .ITEM.name }}{{ else }}echo "yum: unknown kind {{ .ITEM.kind }}" >&2 && exit 1{{ end }}'
      _FAIL_LOG:
        sh: 'printf "%s" "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog"'
    cmds:
      - cmd: '{{ if or (eq (.ITEM.continue_on_error | default false) true) (eq (.CONTINUE_ON_ERROR | default "") "true") }}{{ ._CMD }} || { echo "failed: {{ ._CMD }}" >> "{{ ._FAIL_LOG }}"; }{{ else }}{{ ._CMD }}{{ end }}'

  choco:apply:
    desc: "receive choco-package items (choco install)"
    requires:
      vars:
        - ITEM_JSON
    vars:
      ITEM:
        ref: 'fromJson .ITEM_JSON'
      _CMD: '{{ if eq .ITEM.kind "choco-package" }}choco install -y {{ .ITEM.name }}{{ else }}echo "choco: unknown kind {{ .ITEM.kind }}" >&2 && exit 1{{ end }}'
      _FAIL_LOG:
        sh: 'printf "%s" "${TMPDIR:-${TEMP:-/tmp}}/manifest-dispatch-faillog"'
    cmds:
      - cmd: '{{ if or (eq (.ITEM.continue_on_error | default false) true) (eq (.CONTINUE_ON_ERROR | default "") "true") }}{{ ._CMD }} || { echo "failed: {{ ._CMD }}" >> "{{ ._FAIL_LOG }}"; }{{ else }}{{ ._CMD }}{{ end }}'
